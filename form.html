<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Sign Up</title>
    <script src="script.js" defer></script>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f2f2f2;">

    <div style="width: 400px; margin: 50px auto; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">

        <h1 style="text-align: center; color: #333;">Student Sign Up</h1>
        <p style="text-align: center; color: #666;">Please fill in the details below</p>

        <form id="registrationForm" onsubmit="return validateForm()">

            <div style="margin-bottom: 15px;">
                <label for="name" style="font-weight: bold;">Full Name</label><br>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required
                    style="width: 95%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="email" style="font-weight: bold;">Email Address</label><br>
                <input type="email" id="email" name="email" placeholder="example@email.com" required
                    style="width: 95%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="password" style="font-weight: bold;">Create Password</label><br>
                <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required
                    style="width: 95%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="mobile" style="font-weight: bold;">Contact Number</label><br>
                <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" required
                    style="width: 95%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <button type="submit"
                style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
                Create Account
            </button>

        </form>

    </div>

</body>
</html>
